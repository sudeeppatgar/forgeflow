name: Reusable Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to run the checks
        required: false
        type: string
        default: '22'

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ inputs.node-version }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present
