# Copy this file to .github/workflows/deploy.yml in the frontend repository.
name: Frontend CI and Netlify deployment

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    uses: sudeeppatgar/forgeflow/.github/workflows/reusable-node-ci.yml@main
    with:
      node-version: '22'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    uses: sudeeppatgar/forgeflow/.github/workflows/reusable-netlify-deploy.yml@main
    with:
      node-version: '22'
      publish-dir: dist
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
